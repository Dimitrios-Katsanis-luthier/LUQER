<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magtune Precision Mapper</title>
    <style>
        :root {
            --bg: #121417;
            --card: #1c1f24;
            --accent: #3498db;
            --text: #e0e0e0;
            --success: #2ecc71;
            --danger: #e74c3c;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; height: 100vh;
        }

        /* --- Layout Grid --- */
        .app-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            flex-grow: 1;
        }

        /* --- Sidebar Style --- */
        .sidebar {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #333;
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--accent); letter-spacing: -1px; }
        .subtitle { font-size: 0.8rem; color: #777; margin-bottom: 20px; }

        label { font-size: 0.75rem; font-weight: bold; color: #aaa; text-transform: uppercase; }
        input[type="text"] {
            background: #000; border: 1px solid #444; color: white;
            padding: 10px; border-radius: 6px; font-size: 14px;
        }

        /* --- Buttons --- */
        .btn {
            padding: 12px; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #2980b9; transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid #444; color: #aaa; }
        .btn-outline:hover { border-color: var(--accent); color: white; }
        .btn-save { background: var(--success); color: white; margin-top: auto; }

        /* --- Main Content --- */
        .main-content {
            display: flex; flex-direction: column; gap: 15px;
        }

        .status-bar {
            background: var(--card); padding: 12px 20px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #333; font-size: 0.9rem;
        }

        #canvas-holder {
            background: #000; border-radius: 12px; overflow: auto;
            border: 1px solid #333; display: flex; justify-content: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        canvas { cursor: crosshair; }

        /* Hide default file input */
        #upload { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- LEFT SIDE: CONTROLS -->
        <aside class="sidebar">
            <h1>MAGTUNE</h1>
            <div class="subtitle">Precision Magnetic Mapping</div>

            <label for="upload" class="btn btn-outline" style="cursor:pointer">
                📁 Load Guitar Photo
            </label>
            <input type="file" id="upload" accept="image/*">

            <hr style="border: 0; border-top: 1px solid #333; width: 100%; margin: 10px 0;">

            <label>Guitar Model</label>
            <input type="text" id="modelName" placeholder="e.g. Fender Stratocaster">

            <label>Serial Number</label>
            <input type="text" id="serialNum" placeholder="e.g. US210345">

            <label>Technician</label>
            <input type="text" id="techName" placeholder="Your Name">

            <div style="height: 20px;"></div>

            <button class="btn btn-outline" onclick="clearLast()">Undo Last Point</button>
            <button class="btn btn-outline" style="color: var(--danger)" onclick="resetAll()">Reset All</button>
            
            <button class="btn btn-save" onclick="downloadImage()">💾 EXPORT FINAL REPORT</button>
        </aside>

        <!-- RIGHT SIDE: WORKSPACE -->
        <main class="main-content">
            <div class="status-bar">
                <div id="status" style="color: var(--accent)">● READY: Please Load Image</div>
                <div id="coords" style="color: #555; font-family: monospace;">X: 0 Y: 0</div>
            </div>

            <div id="canvas-holder">
                <canvas id="mainCanvas"></canvas>
            </div>
        </main>
    </div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const upload = document.getElementById('upload');
    const status = document.getElementById('status');
    const coordsDisp = document.getElementById('coords');

    let img = new Image();
    let markers = [];
    let currentPoint = null;
    let inputBuffer = "";
    let sidebarWidth = 380;

    // --- 1. Image Handler ---
    upload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        img = new Image();
        img.onload = function() {
            const maxW = 1400;
            let w = img.width;
            let h = img.height;
            if (w > maxW) { h = (maxW / w) * h; w = maxW; }
            
            canvas.width = w + sidebarWidth;
            canvas.height = h;
            status.innerText = "● IMAGE LOADED: Click point on guitar";
            status.style.color = "#2ecc71";
            redraw();
        };
        img.src = URL.createObjectURL(file);
    });

    // --- 2. Mouse Click ---
    canvas.addEventListener('mousedown', (e) => {
        if (!img.src) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        if (x > (canvas.width - sidebarWidth)) return;

        currentPoint = { x, y };
        coordsDisp.innerText = `X: ${Math.round(x)} Y: ${Math.round(y)}`;
        status.innerText = "● POINT SET: Press HOLD on Magtune";
        status.style.color = "#f1c40f";
        redraw();
    });

    // --- 3. Magtune HID Input ---
    window.addEventListener('keydown', (e) => {
        if (!currentPoint) return;
        if (e.key === 'Enter') {
            markers.push({ x: currentPoint.x, y: currentPoint.y, text: inputBuffer.trim() + " mm" });
            inputBuffer = "";
            currentPoint = null;
            status.innerText = "● RECORDED: Set next point";
            status.style.color = "#2ecc71";
            redraw();
        } else if (/^[0-9.\-\+\/]$/.test(e.key)) {
            inputBuffer += e.key;
        }
    });

    function redraw() {
        if (!img.src) return;
        const imgW = canvas.width - sidebarWidth;

        // Background
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, imgW, canvas.height);

        // Sidebar Styling
        const sideX = imgW;
        ctx.fillStyle = "#f8f9fa";
        ctx.fillRect(sideX, 0, sidebarWidth, canvas.height);
        
        // Report Header in Sidebar
        ctx.fillStyle = "#1c1f24";
        ctx.fillRect(sideX, 0, sidebarWidth, 120);
        
        ctx.fillStyle = "#3498db";
        ctx.font = "bold 24px Arial";
        ctx.fillText("MAGTUNE REPORT", sideX + 25, 45);
        
        ctx.fillStyle = "#777";
        ctx.font = "12px Arial";
        const dateStr = new Date().toLocaleDateString();
        ctx.fillText(`DATE: ${dateStr}`, sideX + 25, 70);
        ctx.fillText(`MODEL: ${document.getElementById('modelName').value || 'N/A'}`, sideX + 25, 88);
        ctx.fillText(`S/N: ${document.getElementById('serialNum').value || 'N/A'}`, sideX + 25, 105);

        // Table Rows
        markers.forEach((m, i) => {
            const rowY = 160 + (i * 40);
            drawMarker(m.x, m.y, i + 1, "#3498db");

            ctx.fillStyle = i % 2 === 0 ? "#f1f2f6" : "#ffffff";
            ctx.fillRect(sideX + 10, rowY - 25, sidebarWidth - 20, 35);
            
            ctx.fillStyle = "#333";
            ctx.font = "bold 14px Arial";
            ctx.fillText(`${i + 1}.`, sideX + 25, rowY);
            ctx.font = "16px Courier New";
            ctx.fillText(m.text, sideX + 70, rowY);
        });

        if (currentPoint) drawMarker(currentPoint.x, currentPoint.y, "?", "#f1c40f");
    }

    function drawMarker(x, y, label, color) {
        ctx.beginPath();
        ctx.arc(x, y, 16, 0, Math.PI * 2);
        ctx.fillStyle = color; ctx.fill();
        ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = "white"; ctx.font = "bold 15px Arial"; ctx.textAlign = "center";
        ctx.fillText(label, x, y + 5); ctx.textAlign = "left";
    }

    function clearLast() { markers.pop(); redraw(); }
    function resetAll() { if(confirm("Clear all data?")) { markers = []; redraw(); } }

    function downloadImage() {
        if (!img.src) return;
        redraw(); // Ensure metadata is updated
        const link = document.createElement('a');
        link.download = `Magtune_${document.getElementById('serialNum').value || 'Report'}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
    }
</script>
</body>
</html>
