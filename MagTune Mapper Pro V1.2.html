<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Magtune Precision Mapper Pro V41</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
    --bg:#121417; --card:#1c1f24; --accent:#3498db; --border:#333;
    --success:#2ecc71; --off:#444;
}
body{margin:0;font-family:'Segoe UI', Arial, sans-serif;background:var(--bg);color:#e0e0e0; overflow: hidden;}

/* --- Sidebar --- */
.sidebar{
    position:fixed;left:0;top:0;width:320px;height:100vh;
    background:var(--card);padding:20px;display:flex;flex-direction:column;gap:10px;
    border-right: 1px solid var(--border); box-sizing: border-box; z-index: 10;
}
.sidebar-scroll{ flex: 1; overflow-y: auto; padding-right: 5px; }
input, select{ background:#000;border:1px solid var(--border);color:#fff; padding:10px;border-radius:6px;width: 100%;box-sizing: border-box; margin-bottom: 5px; }
.btn{ padding:12px;border:none;border-radius:6px; cursor:pointer;font-weight:bold;transition: 0.2s; font-size: 13px; }
.btn:hover{opacity: 0.8;}
.btn-blue{background:var(--accent);color:white;}
.btn-red{background:#e74c3c;color:white;}
.btn-green{background:var(--success);color:white;}
.btn-gray{background:var(--off);color:white;}

#fileInput{display:none;}

.points-list{ margin-top: 15px; display: flex; flex-direction: column; gap: 5px; }
.point-item{
    background: #000; padding: 8px 12px; border-radius: 4px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; border-left: 4px solid var(--accent);
}
.point-item.selected { border-color: #f1c40f; background: #222; }
.del-btn { color: #e74c3c; cursor: pointer; font-weight: bold; padding: 0 5px; font-size: 16px; }

.app{ margin-left:320px; height:100vh; display:flex; flex-direction: column; }
.workspace{ flex:1; overflow: hidden; position: relative; background: #09090b; display: flex; align-items: center; justify-content: center; }
canvas{ background: #000; cursor: crosshair; }

.control-label { font-size: 11px; color: #888; margin-top: 5px; display: block; font-weight: bold; }
.zoom-controls { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 5px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; }
.btn-group-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
</style>
</head>

<body>

<div class="sidebar">
    <h2 style="color:var(--accent);margin:0;letter-spacing: -1px;">MAGTUNE PRO</h2>
    <label class="btn btn-blue" for="fileInput" style="text-align:center;margin-top:10px;">IMPORT IMAGE</label>
    <input type="file" id="fileInput" accept="image/*">

    <div class="sidebar-scroll">
        <label class="control-label">GUITAR MODEL</label>
        <input type="text" id="model" placeholder="Model Name">
        <label class="control-label">SERIAL NUMBER</label>
        <input type="text" id="serial" placeholder="S/N">
        <label class="control-label">ADDITIONAL INFO</label>
        <input type="text" id="info" placeholder="Technician/Notes">

        <label class="control-label">HEATMAP OPACITY</label>
        <input type="range" id="opacity" min="0" max="100" value="50" oninput="draw()">

        <div class="btn-group-2" style="margin-top:10px;">
            <button class="btn btn-green" onclick="toggleLabels()" id="toggleBtn">LABELS: ON</button>
            <button class="btn btn-gray" onclick="toggleHeatmap()" id="heatBtn">HEATMAP: OFF</button>
        </div>
        <button class="btn btn-gray" style="width:100%; margin-top:10px;" onclick="toggleTraceMode()" id="traceBtn">TRACE: OFF</button>
        <button class="btn btn-gray" style="width:100%; margin-top:5px; font-size: 11px;" onclick="toggleSmoothing()" id="smoothBtn">SMOOTH CURVE: OFF</button>
        <div class="points-list" id="pointsList"></div>
    </div>

    <div class="btn-group-2">
        <button class="btn btn-blue" onclick="undo()">UNDO</button>
        <button class="btn btn-blue" onclick="redo()" style="background:#5d6d7e">REDO</button>
    </div>
    
    <div class="btn-group-2">
        <button class="btn btn-gray" onclick="exportDXF()" style="font-size: 10px;">EXPORT DXF</button>
        <button class="btn btn-gray" onclick="exportSVG()" style="font-size: 10px;">EXPORT SVG</button>
    </div>

    <button class="btn btn-red" onclick="resetAll()">RESET</button>
    <button class="btn btn-green" onclick="exportPDF()">EXPORT PDF REPORT</button>
</div>

<div class="app">
    <div class="workspace" id="workspace">
        <canvas id="canvas"></canvas>
        <div class="zoom-controls">
            <button class="btn btn-gray" onclick="adjustZoom(1.2)">+</button>
            <button class="btn btn-gray" onclick="adjustZoom(0.8)">-</button>
            <button class="btn btn-gray" onclick="resetZoom()">FIT</button>
        </div>
    </div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const fileInput=document.getElementById("fileInput");
const workspace=document.getElementById("workspace");

let img=new Image();
let markers=[], maskPoints=[], historyStack=[], redoStack=[];
let traceMode=false, smoothingMode=false, showLabels=true, heatmapMode=false;
let currentPoint=null, inputBuffer="", selectedIndex = null;

/* ===== ZOOM & PAN STATE ===== */
let scale = 1, offsetX = 0, offsetY = 0, isPanning = false, dragIndex = null, traceDragIndex = null, startX, startY;

function getImgPos(e) {
    const rect = canvas.getBoundingClientRect();
    const mouseX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const mouseY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: (mouseX - offsetX) / scale, y: (mouseY - offsetY) / scale };
}

function adjustZoom(factor) { scale *= factor; draw(); }
function resetZoom() {
    if(!img.src) return;
    const ratio = Math.min(workspace.clientWidth / img.width, workspace.clientHeight / img.height);
    scale = ratio * 0.9; offsetX = (workspace.clientWidth - img.width * scale) / 2; offsetY = (workspace.clientHeight - img.height * scale) / 2;
    draw();
}

workspace.addEventListener('wheel', (e) => {
    if(!img.src) return; e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    const mouse = getImgPos(e);
    scale *= delta;
    offsetX = e.clientX - workspace.offsetLeft - mouse.x * scale;
    offsetY = e.clientY - workspace.offsetTop - mouse.y * scale;
    draw();
}, { passive: false });

workspace.addEventListener('mousedown', (e) => {
    if(e.button === 1 || e.altKey) { isPanning = true; startX = e.clientX - offsetX; startY = e.clientY - offsetY; return; }
    const p = getImgPos(e);
    const i = markers.findIndex(m => Math.hypot(m.x - p.x, m.y - p.y) < (15 / scale));
    if (i !== -1) { dragIndex = i; selectedIndex = i; updatePointsList(); return; }
    if (traceMode) {
        const i2 = maskPoints.findIndex(pt => Math.hypot(pt.x - p.x, pt.y - p.y) < (10 / scale));
        if (i2 !== -1) { traceDragIndex = i2; } else { saveState(); maskPoints.push(p); }
        draw(); return;
    }
    currentPoint = p; selectedIndex = null; draw();
});

window.addEventListener('mousemove', (e) => {
    if(isPanning) { offsetX = e.clientX - startX; offsetY = e.clientY - startY; draw(); }
    if(dragIndex !== null) { const p = getImgPos(e); markers[dragIndex].x = p.x; markers[dragIndex].y = p.y; draw(); }
    if(traceDragIndex !== null){ const p = getImgPos(e); maskPoints[traceDragIndex].x = p.x; maskPoints[traceDragIndex].y = p.y; draw(); }
});

window.addEventListener('mouseup', () => { isPanning = false; if(dragIndex !== null || traceDragIndex !== null) saveState(); dragIndex = null; traceDragIndex = null; });

/* ===== UI TOGGLES ===== */
function updateToggleButtons(){
    const btns = [
        {id: "toggleBtn", state: showLabels, label: "LABELS"},
        {id: "heatBtn", state: heatmapMode, label: "HEATMAP"},
        {id: "traceBtn", state: traceMode, label: "TRACE"},
        {id: "smoothBtn", state: smoothingMode, label: "SMOOTH CURVE"}
    ];
    btns.forEach(b => {
        const el = document.getElementById(b.id);
        el.innerText = b.label + ": " + (b.state ? "ON" : "OFF");
        el.className = "btn " + (b.state ? "btn-green" : "btn-gray");
    });
}

function toggleLabels() { showLabels = !showLabels; updateToggleButtons(); draw(); }
function toggleHeatmap() { heatmapMode = !heatmapMode; updateToggleButtons(); draw(); updatePointsList(); }
function toggleTraceMode() { traceMode = !traceMode; updateToggleButtons(); draw(); }
function toggleSmoothing() { smoothingMode = !smoothingMode; updateToggleButtons(); draw(); }

/* ===== CURVE & COLOR ENGINE ===== */
function getSmoothColor(val) {
    if (markers.length < 2) return { r: 52, g: 152, b: 219, hex: "#3498db" };
    const values = markers.map(m => m.value);
    const max = Math.max(...values), min = Math.min(...values);
    const range = max - min;
    const norm = range === 0 ? 0.5 : (val - min) / range;
    const colors = [{p:0,r:52,g:152,b:219},{p:.25,r:46,g:204,b:113},{p:.5,r:241,g:196,b:15},{p:.75,r:230,g:126,b:34},{p:1,r:231,g:76,b:60}];
    let l = colors[0], u = colors[4];
    for (let i = 0; i < 4; i++) if (norm >= colors[i].p && norm <= colors[i+1].p) { l = colors[i]; u = colors[i+1]; break; }
    const sN = (norm - l.p) / (u.p - l.p);
    const r = Math.round(l.r + sN * (u.r - l.r)), g = Math.round(l.g + sN * (u.g - l.g)), b = Math.round(l.b + sN * (u.b - l.b));
    return { r, g, b, hex: `rgb(${r},${g},${b})` };
}

function getCurvePoints(pts, isClosed) {
    if (pts.length < 2) return pts;
    let res = [], tension = 0.5, numOfSegments = 16, _pts = pts.slice(0);
    if (isClosed) { _pts.unshift(pts[pts.length-1]); _pts.push(pts[0]); _pts.push(pts[1]); }
    else { _pts.unshift(pts[0]); _pts.push(pts[pts.length-1]); }
    for (let i = 1; i < (_pts.length - 2); i++) {
        for (let t = 0; t <= numOfSegments; t++) {
            let st = t / numOfSegments;
            let c1 = 2*Math.pow(st,3)-3*Math.pow(st,2)+1, c2 = -2*Math.pow(st,3)+3*Math.pow(st,2), c3 = Math.pow(st,3)-2*Math.pow(st,2)+st, c4 = Math.pow(st,3)-Math.pow(st,2);
            let t1x = (_pts[i+1].x-_pts[i-1].x)*tension, t2x = (_pts[i+2].x-_pts[i].x)*tension, t1y = (_pts[i+1].y-_pts[i-1].y)*tension, t2y = (_pts[i+2].y-_pts[i].y)*tension;
            res.push({ x: c1*_pts[i].x + c2*_pts[i+1].x + c3*t1x + c4*t2x, y: c1*_pts[i].y + c2*_pts[i+1].y + c3*t1y + c4*t2y });
        }
    }
    return res;
}

function drawSurfaceMap(tCtx, w, h) {
    if (markers.length < 3) return;
    const grid = 10, opacity = document.getElementById("opacity").value / 100;
    tCtx.save();
    if (maskPoints.length > 2) {
        tCtx.beginPath();
        const pts = smoothingMode ? getCurvePoints(maskPoints, true) : maskPoints;
        tCtx.moveTo(pts[0].x, pts[0].y);
        for(let i=1; i<pts.length; i++) tCtx.lineTo(pts[i].x, pts[i].y);
        tCtx.closePath(); tCtx.clip();
    }
    for (let x = 0; x < w; x += grid) {
        for (let y = 0; y < h; y += grid) {
            let sumW = 0, sumV = 0, found = false;
            for (let m of markers) {
                const d = Math.hypot(x - m.x, y - m.y);
                if (d < grid) { sumV = m.value; found = true; break; }
                const weight = 1 / Math.pow(d, 2.5); sumV += m.value * weight; sumW += weight;
            }
            const val = found ? sumV : (sumV / sumW);
            tCtx.globalAlpha = opacity; tCtx.fillStyle = getSmoothColor(val).hex; tCtx.fillRect(x, y, grid, grid);
        }
    }
    tCtx.restore();
}

/* ===== APP LOGIC ===== */
fileInput.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=evt=>{
        img=new Image();
        img.onload=()=>{ canvas.width = workspace.clientWidth; canvas.height = workspace.clientHeight; resetZoom(); };
        img.src=evt.target.result;
    };
    reader.readAsDataURL(file);
};

window.onkeydown=e=>{
    if(!currentPoint || traceMode) return;
    if(e.key==="Enter"){
        if(inputBuffer==="")return;
        saveState(); markers.push({ x:currentPoint.x, y:currentPoint.y, value:parseFloat(inputBuffer) });
        inputBuffer=""; currentPoint=null; updatePointsList(); draw();
    } else if(e.key==="Backspace"){ inputBuffer=inputBuffer.slice(0,-1); draw(); } 
    else if(/^[0-9.\-]$/.test(e.key)){ inputBuffer+=e.key; draw(); }
};

function updatePointsList(){
    const list = document.getElementById("pointsList");
    list.innerHTML = markers.length ? '<label class="control-label">LOGGED POINTS</label>' : '';
    markers.forEach((m, i) => {
        const item = document.createElement("div");
        item.className = `point-item ${selectedIndex === i ? 'selected' : ''}`;
        item.style.borderLeftColor = getSmoothColor(m.value).hex;
        item.innerHTML = `<span><b>${i+1}.</b> ${m.value}mm</span><span class="del-btn" onclick="deletePoint(${i}, event)">✕</span>`;
        item.onclick = () => { selectedIndex = i; draw(); };
        list.appendChild(item);
    });
}
function deletePoint(i, e){ e.stopPropagation(); saveState(); markers.splice(i, 1); updatePointsList(); draw(); }

function draw(){
    if(!img.src) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.save(); ctx.translate(offsetX, offsetY); ctx.scale(scale, scale);
    ctx.drawImage(img,0,0);
    if (heatmapMode) drawSurfaceMap(ctx, img.width, img.height);
    if (maskPoints.length > 0) {
        ctx.beginPath(); ctx.strokeStyle = "#9b59b6"; ctx.lineWidth = 2/scale;
        const pts = (smoothingMode && maskPoints.length > 2) ? getCurvePoints(maskPoints, !traceMode) : maskPoints;
        ctx.moveTo(pts[0].x, pts[0].y);
        for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        if(!traceMode) ctx.closePath();
        ctx.stroke();
        maskPoints.forEach(pt=>{ ctx.beginPath(); ctx.arc(pt.x, pt.y, 4/scale, 0, Math.PI*2); ctx.fillStyle="#9b59b6"; ctx.fill(); });
    }
    markers.forEach((m, i)=>{
        const c = getSmoothColor(m.value).hex;
        ctx.beginPath(); ctx.arc(m.x, m.y, 6/scale, 0, Math.PI*2);
        ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = (selectedIndex === i) ? "#fff" : "rgba(255,255,255,0.5)"; ctx.lineWidth = 2/scale; ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.font = `bold ${10/scale}px Arial`; ctx.textAlign = "center"; ctx.fillText(i+1, m.x, m.y - (10/scale));
        if(showLabels){ ctx.font = `${12/scale}px Arial`; ctx.textAlign = "left"; ctx.fillText(m.value + " mm", m.x + (12/scale), m.y); }
    });
    if(currentPoint){ ctx.beginPath(); ctx.arc(currentPoint.x,currentPoint.y,6/scale,0,Math.PI*2); ctx.fillStyle="#f1c40f"; ctx.fill();
        if(inputBuffer){ ctx.fillStyle="#f1c40f"; ctx.font=`bold ${14/scale}px Arial`; ctx.fillText(inputBuffer+" mm", currentPoint.x+(12/scale), currentPoint.y); }}
    ctx.restore();
}

function saveState(){ historyStack.push({m:JSON.parse(JSON.stringify(markers)), mp:JSON.parse(JSON.stringify(maskPoints))}); redoStack=[]; }
function undo(){ if(historyStack.length){ const s=historyStack.pop(); redoStack.push({m:JSON.parse(JSON.stringify(markers)), mp:JSON.parse(JSON.stringify(maskPoints))}); markers=s.m; maskPoints=s.mp; updatePointsList(); draw(); }}
function redo(){ if(redoStack.length){ const s=redoStack.pop(); historyStack.push({m:JSON.parse(JSON.stringify(markers)), mp:JSON.parse(JSON.stringify(maskPoints))}); markers=s.m; maskPoints=s.mp; updatePointsList(); draw(); }}
function resetAll() { if(confirm("Reset everything?")){ saveState(); markers=[]; maskPoints=[]; draw(); updatePointsList(); } }

/* ===== VECTOR EXPORTS (ONLY TRACE) ===== */
function exportSVG() {
    if (!img.src || maskPoints.length < 2) return;
    let svg = `<svg viewBox="0 0 ${img.width} ${img.height}" xmlns="http://www.w3.org/2000/svg">`;
    const pts = smoothingMode ? getCurvePoints(maskPoints, true) : maskPoints;
    let d = `M ${pts[0].x} ${pts[0].y} ` + pts.map(p => `L ${p.x} ${p.y}`).join(' ') + " Z";
    svg += `<path d="${d}" fill="none" stroke="purple" stroke-width="2"/>`;
    svg += `</svg>`;
    const blob = new Blob([svg], {type: 'image/svg+xml'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "Magtune_Outline.svg"; a.click();
}

function exportDXF() {
    if (maskPoints.length < 2) return;
    let dxf = `0\nSECTION\n2\nENTITIES\n`;
    const pts = smoothingMode ? getCurvePoints(maskPoints, true) : maskPoints;
    for (let i = 0; i < pts.length; i++) {
        let next = pts[(i+1)%pts.length];
        dxf += `0\nLINE\n8\nOutline\n10\n${pts[i].x}\n20\n${-pts[i].y}\n11\n${next.x}\n21\n${-next.y}\n`;
    }
    dxf += `0\nENDSEC\n0\nEOF`;
    const blob = new Blob([dxf], {type: 'application/dxf'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "Magtune_Outline.dxf"; a.click();
}

/* ===== PDF EXPORT (STABLE) ===== */
function exportPDF(){
    const { jsPDF } = window.jspdf;
    const pdf=new jsPDF("landscape","mm","a4");
    const pageW=297, pageH=210, margin=10, rightW=85;
    const eCanv = document.createElement("canvas");
    const eCtx = eCanv.getContext("2d");
    eCanv.width = img.width; eCanv.height = img.height;
    eCtx.drawImage(img,0,0);
    if(heatmapMode) drawSurfaceMap(eCtx, img.width, img.height);
    markers.forEach((m, i)=>{
        eCtx.beginPath(); eCtx.arc(m.x, m.y, 10, 0, Math.PI*2);
        eCtx.fillStyle = getSmoothColor(m.value).hex; eCtx.fill();
        eCtx.strokeStyle = "white"; eCtx.lineWidth = 2; eCtx.stroke();
        eCtx.fillStyle="white"; eCtx.font="bold 16px Arial"; eCtx.textAlign="center";
        eCtx.fillText(i+1, m.x, m.y-15);
    });
    const imgData = eCanv.toDataURL("image/jpeg", 0.9);
    const ratio = img.width/img.height;
    let w = pageW-rightW-20, h = w/ratio;
    if(h > pageH-20){ h=pageH-20; w=h*ratio; }
    pdf.addImage(imgData, "JPEG", 10, (pageH-h)/2, w, h);
    pdf.setFillColor(28, 31, 36); pdf.rect(pageW-rightW, 0, rightW, pageH, 'F');
    pdf.setTextColor(52, 152, 219); pdf.setFontSize(14); pdf.text("MAGTUNE REPORT", pageW-rightW+5, 15);
    const now = new Date();
    const dStr = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
    pdf.setTextColor(150,150,150); pdf.setFontSize(8); pdf.text(dStr, pageW-5, 15, {align:'right'});
    pdf.setTextColor(255,255,255); pdf.setFontSize(9);
    let curY = 30;
    const meta = [{l:"Model", v:document.getElementById("model").value}, {l:"Serial", v:document.getElementById("serial").value}, {l:"Info", v:document.getElementById("info").value}];
    meta.forEach(m => { const txt = pdf.splitTextToSize(`${m.l}: ${m.v || "N/A"}`, rightW-10); pdf.text(txt, pageW-rightW+5, curY); curY += (txt.length*4.5)+2; });
    curY += 5; pdf.setDrawColor(80,80,80); pdf.line(pageW-rightW+5, curY, pageW-5, curY);
    curY += 7; pdf.text("Measurements (mm):", pageW-rightW+5, curY); curY += 8;
    const startY = curY; let currentCol = 0; let itemY = startY;
    pdf.setFontSize(7);
    markers.forEach((m, i) => { if (itemY > pageH - 10) { currentCol++; itemY = startY; }
        const x = (pageW-rightW+5) + (currentCol*26);
        if (x < pageW-5) { pdf.setTextColor(180,180,180); pdf.text(`${i+1}.`, x, itemY); const c = getSmoothColor(m.value); pdf.setTextColor(c.r, c.g, c.b); pdf.text(`${m.value}`, x+6, itemY); itemY += 4.5; }
    });
    pdf.save("Magtune_Report.pdf");
}
</script>
</body>
