<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magtune Precision Mapper</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root {
    --bg:#121417;
    --card:#1c1f24;
    --accent:#3498db;
    --text:#e0e0e0;
    --green:#2ecc71;
    --danger:#e74c3c;
}

body{
    margin:0;
    font-family:Arial;
    background:var(--bg);
    color:var(--text);
}

/* FIXED SIDEBAR */
.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:320px;
    height:100vh;
    background:var(--card);
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow:auto;
}

.app{
    margin-left:320px;
    display:flex;
    height:100vh;
}

/* BUTTONS */
.btn{
    padding:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.btn-blue{background:var(--accent); color:white;}
.btn-green{background:var(--green); color:white;}
.btn-red{background:var(--danger); color:white;}

#fileInput{display:none;}

/* INPUTS → FULL BLACK CONSISTENCY */
input{
    background:#000;
    border:1px solid #333;
    color:#fff;
    padding:8px;
    border-radius:6px;
}

/* REMOVE DOTS / LINES COMPLETELY */
.sidebar hr{
    display:none;
}

/* TABLE */
#table div{
    padding:6px;
    cursor:pointer;
    border-bottom:1px solid #333;
}

canvas{
    cursor:crosshair;
    max-width:100%;
}

.workspace{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<h2 style="color:var(--accent)">MAGTUNE</h2>

<label class="btn btn-blue" for="fileInput" style="text-align:center;">
IMPORT IMAGE
</label>
<input type="file" id="fileInput" accept="image/*">

<label>Model</label>
<input type="text" id="modelName">

<label>Serial Number</label>
<input type="text" id="serialNum">

<label>Info</label>
<input type="text" id="info">

<button class="btn btn-blue" onclick="undoLast()">Undo Last Point</button>
<button class="btn btn-red" onclick="resetAll()">Reset All</button>
<button class="btn btn-green" onclick="downloadPDF()">Export PDF</button>

<div id="table"></div>

</div>

<!-- WORKSPACE -->
<div class="app">
<div class="workspace">
<canvas id="canvas"></canvas>
</div>
</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const fileInput=document.getElementById("fileInput");
const table=document.getElementById("table");

let img=new Image();
let markers=[];

let currentPoint=null;
let inputBuffer="";
let selectedIndex=null;

let dragIndex=null;
let dragOffsetX=0;
let dragOffsetY=0;

/* ================= IMAGE LOAD ================= */
fileInput.onchange=e=>{
    const file=e.target.files[0];
    if(!file) return;

    img=new Image();

    img.onload=()=>{
        const maxW=1400;
        let w=img.width;
        let h=img.height;

        if(w>maxW){
            h=(maxW/w)*h;
            w=maxW;
        }

        canvas.width=w;
        canvas.height=h;

        draw();
    };

    img.src=URL.createObjectURL(file);
};

/* ================= DRAG ================= */
canvas.onmousedown=e=>{
    const r=canvas.getBoundingClientRect();

    const x=(e.clientX-r.left)*(canvas.width/r.width);
    const y=(e.clientY-r.top)*(canvas.height/r.height);

    dragIndex = markers.findIndex(m =>
        Math.hypot(m.x-x,m.y-y) < 15
    );

    if(dragIndex !== -1){
        dragOffsetX=x-markers[dragIndex].x;
        dragOffsetY=y-markers[dragIndex].y;
        return;
    }

    currentPoint={x,y};
    draw();
};

canvas.onmousemove=e=>{
    if(dragIndex===null) return;

    const r=canvas.getBoundingClientRect();

    const x=(e.clientX-r.left)*(canvas.width/r.width);
    const y=(e.clientY-r.top)*(canvas.height/r.height);

    markers[dragIndex].x=x-dragOffsetX;
    markers[dragIndex].y=y-dragOffsetY;

    draw();
};

canvas.onmouseup=()=>dragIndex=null;
canvas.onmouseleave=()=>dragIndex=null;

/* ================= INPUT ================= */
window.onkeydown=e=>{

    if(!currentPoint) return;

    if(e.key==="Enter"){
        if(!inputBuffer.trim()) return;

        markers.push({
            x:currentPoint.x,
            y:currentPoint.y,
            text:inputBuffer.trim()+" mm"
        });

        currentPoint=null;
        inputBuffer="";

        sync();
    }
    else if(/^[0-9.\-]$/.test(e.key)){
        inputBuffer+=e.key;
    }
};

/* ================= DRAW ================= */
function draw(){

    if(!img.src) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);

    markers.forEach((m,i)=>{

        ctx.beginPath();
        ctx.arc(m.x,m.y,14,0,Math.PI*2);

        ctx.fillStyle=(i===selectedIndex)?"#2ecc71":"#3498db";
        ctx.fill();

        ctx.fillStyle="#fff";
        ctx.textAlign="center";
        ctx.textBaseline="middle";
        ctx.fillText(i+1,m.x,m.y);
    });

    if(currentPoint){
        ctx.beginPath();
        ctx.arc(currentPoint.x,currentPoint.y,14,0,Math.PI*2);
        ctx.fillStyle="#f1c40f";
        ctx.fill();
    }
}

/* ================= TABLE ================= */
function sync(){

    table.innerHTML="";

    markers.forEach((m,i)=>{

        const div=document.createElement("div");
        div.textContent=`${i+1}. ${m.text}`;

        div.onclick=()=>{
            selectedIndex=(selectedIndex===i)?null:i;
            draw();
            sync();
        };

        if(i===selectedIndex){
            div.style.background="#2ecc71";
            div.style.color="#000";
        }

        table.appendChild(div);
    });

    draw();
}

/* ================= UNDO ================= */
function undoLast(){
    markers.pop();
    draw();
    sync();
}

function resetAll(){
    markers=[];
    currentPoint=null;
    selectedIndex=null;
    inputBuffer="";
    draw();
    sync();
}

/* ================= FIXED PDF (NO DISTORTION) ================= */
function downloadPDF(){

    const { jsPDF }=window.jspdf;
    const pdf=new jsPDF("landscape","mm","a4");

    const pageW=170;
    const pageH=160;

    const imgData=canvas.toDataURL("image/png",1.0);

    /* FIX: KEEP ASPECT RATIO */
    const imgRatio = canvas.width / canvas.height;

    let w = pageW;
    let h = pageW / imgRatio;

    if(h > pageH){
        h = pageH;
        w = pageH * imgRatio;
    }

    pdf.addImage(imgData,"PNG",10,10,w,h);

    let x=190;
    let y=15;

    pdf.setFontSize(14);
    pdf.text("MAGTUNE REPORT",x,y);
    y+=10;

    const model=document.getElementById("modelName").value.trim();
    const serial=document.getElementById("serialNum").value.trim();
    const info=document.getElementById("info").value.trim();

    pdf.setFontSize(10);

    if(model){ pdf.text(`Model: ${model}`,x,y); y+=7; }
    if(serial){ pdf.text(`Serial: ${serial}`,x,y); y+=7; }
    if(info){ pdf.text(`Info: ${info}`,x,y); y+=7; }

    y+=5;
    pdf.text("MEASUREMENTS",x,y);
    y+=8;

    markers.forEach((m,i)=>{
        pdf.text(`${i+1}. ${m.text}`,x,y);
        y+=7;
    });

    pdf.save("magtune.pdf");
}

</script>

</body>
</html>
